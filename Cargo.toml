[package]
name = "iconator"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
axum-test = "21.1.0"
env_logger = "0.11.11"
fst = "0.4.7"
lazy_static = "1.5.1"
log = "0.4.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "macros", "rt-multi-thread", "signal"] }

[build-dependencies]
fst = "0.4.7"
